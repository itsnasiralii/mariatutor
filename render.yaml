services:
  - type: web
    name: burewala-tutor-marketplace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: IDENTIFIER_PEPPER
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: burewala-tutor-db
          property: connectionString
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        value: admin@mariahome.com
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        value: Admin123

databases:
  - name: burewala-tutor-db
    plan: free
